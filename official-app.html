
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#11102b">

  <title>Install Official App</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background-image: url("https://ik.imagekit.io/v3c8xxz93/desktop.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .install-overlay {
      min-height: 100vh;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: rgba(5, 5, 20, 0.35);
    }

    .install-card {
      width: 100%;
      max-width: 420px;
      padding: 38px 28px;
      text-align: center;
      background: rgba(16, 15, 48, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 22px;
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.4);
    }

    .app-icon {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 22px;
      margin: 0 auto 22px;
      display: block;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
    }

    .install-card h1 {
      font-size: 29px;
      font-weight: 700;
      margin-bottom: 28px;
      color: #ffffff;
    }

    .install-btn {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      min-height: 58px;
      border: none;
      border-radius: 12px;
      background: #ffd43b;
      color: #17142b;
      font-size: 19px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .install-btn:hover {
      background: #ffca18;
      transform: translateY(-2px);
    }

    @media (max-width: 767px) {
      body {
        background-image: url("https://ik.imagekit.io/v3c8xxz93/mobile.jpg");
        background-position: center;
      }

      .install-overlay {
        padding: 12px;
      }

      .install-card {
        max-width: 370px;
        padding: 32px 22px;
      }

      .app-icon {
        width: 90px;
        height: 90px;
      }

      .install-card h1 {
        font-size: 25px;
      }

      .install-btn {
        min-height: 56px;
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <main class="install-overlay">
    <div class="install-card">

      <img
        class="app-icon"
        src="https://ik.imagekit.io/v3c8xxz93/unnamed.webp"
        alt="mos8be8 app icon"
      >

      <h1>Install Official App</h1>

      <a
        class="install-btn"
        href="https://playclickarena650.sbs/"
      >
        Install Now
      </a>

    </div>
  </main>

</body>
</html>
